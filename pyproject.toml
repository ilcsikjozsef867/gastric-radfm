[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cais-gastric-staging"
version = "0.1.0"
description = "CAIS gastric cancer staging research code"
requires-python = ">=3.10"
dependencies = [
  "torch==2.2.2",
  "numpy==1.26.4",
  "scipy==1.11.4",
  "scikit-learn==1.4.2",
  "pydantic==2.7.4",
  "tqdm==4.66.4"
]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "code"
